# Xiaov2board node: AnyTLS; server_name must match the certificate/client SNI.
type=xiaov2board
server_type=anytls
api=webapi
node_id=52
webapi_url=https://panel.example.com/
webapi_key=replace-with-your-server-token
listen=0.0.0.0
check_interval=60
submit_interval=60
tcp_timeout=120
udp_timeout=2
forbidden_bit_torrent=false
cert_mode=file
cert_file=/project/certificates/anytls/fullchain.pem
key_file=/project/certificates/anytls/privkey.pem
