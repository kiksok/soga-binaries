# Xiaov2board node: VLESS, network=tcp, tls=1, flow/encryption empty.
type=xiaov2board
server_type=vless
api=webapi
node_id=37
webapi_url=https://panel.example.com/
webapi_key=replace-with-your-server-token
soga_key=local
listen=0.0.0.0
check_interval=60
submit_interval=60
tcp_timeout=120
udp_timeout=2
forbidden_bit_torrent=false
cert_mode=file
cert_file=/project/certificates/vless/fullchain.pem
key_file=/project/certificates/vless/privkey.pem
