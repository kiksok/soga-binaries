# Xiaov2board node: VLESS, network=ws, tls=0, path=/soga-ws.
# Example assumes a local reverse proxy terminates TLS and forwards to Soga.
type=xiaov2board
server_type=vless
api=webapi
node_id=38
webapi_url=https://panel.example.com/
webapi_key=replace-with-your-server-token
soga_key=local
listen=127.0.0.1
check_interval=60
submit_interval=60
tcp_timeout=120
udp_timeout=2
forbidden_bit_torrent=false
